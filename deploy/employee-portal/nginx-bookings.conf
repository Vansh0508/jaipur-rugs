# Serves the employee portal at http://192.168.0.18/bookings (port 80, no port number).
# The app itself is built with basePath "/bookings" (apps/admin/employee-portal/next.config.js)
# and runs under PM2 on :3002, so the path is passed through unchanged — no trailing slash on
# proxy_pass, or nginx would strip /bookings and Next would 404.
#
# Install on the office server (needs sudo):
#   sudo cp deploy/employee-portal/nginx-bookings.conf /etc/nginx/default.d/bookings.conf   # if default.d is included, else:
#   include this file inside the `server { listen 80 default_server; ... }` block in
#   /etc/nginx/sites-available/default, then:  sudo nginx -t && sudo systemctl reload nginx
location /bookings {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
