# Supabase CLI config for local dev + `supabase functions deploy`.
# Confirmed live project (2026-08-17, see db/MIGRATIONS.md): matnispbauvvlnbsuzxq.
project_id = "matnispbauvvlnbsuzxq"

[functions.guest-signup]
# Pure phone-match-or-create data entry, no auth involved at all (guests are never
# Supabase Auth users — see the function source). No session to gate on.
verify_jwt = false

[functions.employee-signin]
# Employee code + phone match against `employees` — not Supabase Auth, no session exists
# yet at this bootstrap step (mirrors guest-signup). No JWT to gate on.
verify_jwt = false

[functions.submit-feedback]
# Neither reviewer path (guestId or employeeId) carries a Supabase session anymore — both
# are plain data labels in the request body, not a JWT. No JWT to gate on.
verify_jwt = false

# Journeys module (apps/admin/internal-portal) — every function below is Internal Portal
# admin-only with no guest/unauthenticated path at all, unlike the two above, so the
# platform-level JWT gate can stay on (defense-in-depth in front of each function's own
# requireInternalPortalAdmin check via supabase/functions/_shared/authz.ts).
[functions.create-car]
verify_jwt = true

[functions.update-car-status]
verify_jwt = true

[functions.create-driver]
verify_jwt = true

[functions.create-journey]
verify_jwt = true

[functions.update-journey]
verify_jwt = true

[functions.cancel-journey]
verify_jwt = true

[functions.approve-feedback]
verify_jwt = true

[functions.upload-driver-photo]
verify_jwt = true

# Orders module (apps/atlas) — see db/orders/README.md. One auth system (Supabase Auth)
# throughout; Clerk was briefly used for "merchants" before 2026-09-01's correction that
# those are internal salespeople, not external customers — see
# db/orders/006_merchant_auth_consolidation.sql.
[functions.orders-sync]
# Invoked by db/orders/003_orders_sync_cron.sql's pg_cron job, not a user session — no
# JWT to gate on. Checks its own shared-secret header instead (see the function source);
# this is NOT "no auth," it's "a different kind of auth than PostgREST's JWT gate."
verify_jwt = false

[functions.orders-update-stage]
verify_jwt = true

[functions.orders-set-shipping-detail]
verify_jwt = true

[functions.merchants-invite]
verify_jwt = true

[functions.merchants-link-clerk-account]
# RETIRED 2026-09-01 — kept deployed only as a static 410 stub (see the function
# source), verify_jwt off since it's a plain informational response to anyone who still
# has the old URL, not a real auth-gated endpoint.
verify_jwt = false

# 004's workflow layer — every one of these expects a real employee session
# (requireActiveEmployee/requireAtlasAccess both call anonClient.auth.getUser()), so
# `true` (the CLI default when a function has no entry at all — these five were simply
# missing from this file, not intentionally defaulted) is correct; listed explicitly for
# the same defense-in-depth documentation reason as every function above.
[functions.orders-create-request]
verify_jwt = true

[functions.orders-action-request]
verify_jwt = true

[functions.orders-mark-request-seen]
verify_jwt = true

[functions.orders-record-milestone]
verify_jwt = true

[functions.orders-escalate-order]
verify_jwt = true
